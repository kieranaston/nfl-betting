<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NFL Reception Props</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
</head>
<body>
  <header>
    <h1>NFL WR/TE Reception Props</h1>
    <p class="subtitle">Automated model picks &amp; season tracking</p>
  </header>

  <section class="stats-grid" id="stats-grid">
    <div class="stat-card">
      <span class="stat-label">Record</span>
      <span class="stat-value" id="record">—</span>
    </div>
    <div class="stat-card">
      <span class="stat-label">Win %</span>
      <span class="stat-value" id="win-pct">—</span>
    </div>
    <div class="stat-card">
      <span class="stat-label">Avg Brier</span>
      <span class="stat-value" id="avg-brier">—</span>
    </div>
    <div class="stat-card">
      <span class="stat-label">Avg CLV</span>
      <span class="stat-value" id="avg-clv">—</span>
    </div>
  </section>

  <section class="charts">
    <div class="chart-container">
      <h2>Brier Score by Week</h2>
      <canvas id="brier-chart"></canvas>
    </div>
    <div class="chart-container">
      <h2>CLV by Week</h2>
      <canvas id="clv-chart"></canvas>
    </div>
  </section>

  <section>
    <h2>Latest Picks</h2>
    <div class="table-wrap">
      <table id="picks-table">
        <thead>
          <tr>
            <th>Player</th>
            <th>Pos</th>
            <th>Line</th>
            <th>Pick</th>
            <th>Edge</th>
            <th>Model μ</th>
            <th>Price</th>
            <th>Matchup</th>
          </tr>
        </thead>
        <tbody id="picks-body">
          <tr><td colspan="8" class="empty">Loading…</td></tr>
        </tbody>
      </table>
    </div>
  </section>

  <footer>
    <p>Model: negative binomial GLM · Odds: The Odds API · Data: nflverse</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
