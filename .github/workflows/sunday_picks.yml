name: Sunday Picks

on:
  schedule:
    # Sun 11:00 ET (15:00 UTC during EDT, 16:00 UTC during EST)
    - cron: "0 15 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  picks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate picks
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python scripts/predict.py

      - name: Sync dashboard data
        run: python scripts/sync_site_data.py

      - name: Commit predictions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add predictions/ site/data/
          git diff --staged --quiet || git commit -m "Sunday: weekly reception picks [automated]"
          git push
