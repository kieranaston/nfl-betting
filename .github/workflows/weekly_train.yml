name: Weekly Train & Grade

on:
  schedule:
    # Tue 10:00 ET (14:00 UTC during EDT, 15:00 UTC during EST)
    - cron: "0 14 * * 2"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Grade last week
        run: python scripts/grade.py

      - name: Pull data & retrain
        run: |
          python scripts/pull_data.py
          python scripts/train.py

      - name: Sync dashboard data
        run: python scripts/sync_site_data.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ model/ results/ site/data/
          git diff --staged --quiet || git commit -m "Weekly: grade, retrain, update results [automated]"
          git push
